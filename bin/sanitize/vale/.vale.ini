# Prose linting for Scaleway docs. Rules encode https://www.scaleway.com/en/docs/guidelines/
# Install: brew install vale   |   Run alone: vale --config bin/sanitize/vale/.vale.ini pages/block-storage/
StylesPath = styles
MinAlertLevel = suggestion
Vocab = Scaleway

[*.mdx]
BasedOnStyles = Vale, Scaleway
# Skip import lines, JSX expressions and self-closing components
TokenIgnores = (^import .*$), (\{[^}]*\}), (<[A-Z][A-Za-z]*[^>]*/>)
# Spelling is not checked here: too noisy on tool/product names, and typos (https://github.com/crate-ci/typos) already covers it.
Vale.Spelling = NO
# Terms enforces vocab casing; too strict for tool names that appear in prose and in code
Vale.Terms = NO
