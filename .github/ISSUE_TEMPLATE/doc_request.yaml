name: Documentation request
description: Suggest a topic or new documentation you think we should add.
title: '👩‍💻 Documentation Request: '
labels: 'Documentation Request'
body:
  - type: textarea
    attributes:
      label: Summary
      placeholder: |
        Quick summary of what is this documentation request about, such as
          - Topic of the documentation
          - Short description
          - Outline
    validations:
      required: true
  - type: textarea
    attributes:
      label: Why is it needed?
      placeholder: "A clear and concise description of what the problem is. E.g., I'm always frustrated when [...]"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional details
      placeholder: "While the Scaleway Documentation team currently doesn't accept PRs with full articles or structural changes, don't hesitate to share with us drafts here if any."
    validations:
      required: false
  - type: textarea
    attributes:
      label: Related PR(s)
      placeholder: 'Let us know if this is related to an open pull request.'
    validations:
      required: false
