name: Sync Generative Models Catalog

on:
  push:
    branches:
      - 'MTA-7604'  # Juste pour tester le workflow, à supprimer après validation
  schedule:
    # Tous les matins du lundi au vendredi à 08:00 UTC
    - cron: '0 8 * * 1-5'
  workflow_dispatch: # Déclenchement manuel possible via l'onglet Actions

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Model Sync Script
        run: python bin/sync-models.py

      - name: Create Pull Request if changes detected
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs(generative-apis): sync supported models from public catalog"
          branch: "automation/sync-generative-models"
          delete-branch: true
          title: "🤖 docs(generative-apis): update supported models"
          body: |
            ## Automated Product Catalog Sync
            
            This PR was automatically opened because changes were detected in the Scaleway Public Catalog API.

            ### Reviewer Checklist:
            - [ ] Complete `TBD` fields (context window, licenses, descriptions).
            - [ ] Verify formatting and anchors.
          labels: |
            type: maintenance
            product: generative-apis