extends: substitution
message: "Do not use contractions: use '%s' instead of '%s'."
level: warning
ignorecase: true
swap:
  can't: cannot
  won't: will not
  don't: do not
  doesn't: does not
  didn't: did not
  isn't: is not
  aren't: are not
  wasn't: was not
  it's: it is
  you're: you are
  you'll: you will
  you've: you have
  we're: we are
  there's: there is
  that's: that is
  let's: let us
  shouldn't: should not
  couldn't: could not
  wouldn't: would not
